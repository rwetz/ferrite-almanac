[package]
name = "ferrite-almanac"
version = "0.2.0"
description = "A Ferrite almanac for a second screen: block-digit clock, the moon in dither, a live ASCII weather sky."
authors = ["Ryan Wetzstein"]
license = "Apache-2.0"
repository = "https://github.com/rwetz/ferrite-almanac"
readme = "README.md"
keywords = ["gpui", "ferrite", "clock", "weather", "desktop"]
categories = ["gui", "date-and-time"]
edition = "2024"
rust-version = "1.88"

[dependencies]
ferrite-design = { git = "https://github.com/rwetz/ferrite-design", rev = "19c103ba3ffb83b8fff94dbd376fb3768c1f2156" }
# Must match ferrite-design exactly (PITFALLS §1).
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_json = "1"
ureq = "3"

# gpui is sluggish unoptimised; optimise dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[target."cfg(windows)".build-dependencies]
winresource = "0.1.31"
